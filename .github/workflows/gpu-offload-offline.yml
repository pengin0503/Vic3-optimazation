name: Offline GPU Feasibility (CPU-only CI)
on:
  pull_request:
    paths:
      - 'research/experiments/gpu_offload_spike/**'
      - '.github/workflows/gpu-offload-offline.yml'
  workflow_dispatch:
jobs:
  reference-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU verification dependencies
        run: python -m pip install numpy numba
      - name: Run synthetic reference, orchestration and fail-closed tests
        working-directory: research/experiments/gpu_offload_spike
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Compile Python sources
        working-directory: research/experiments/gpu_offload_spike
        run: python -m compileall -q offline_gpu_core.py gpu_opencl.py gpu_runtime.py
