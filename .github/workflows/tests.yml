name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional callgraph test dependency
        run: python -m pip install -r tools/requirements-callgraph.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
